name: Build PULSE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        continue-on-error: true
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & archive
        run: |
          set -o pipefail
          xcodebuild \
            -project PULSE.xcodeproj \
            -scheme PULSE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PULSE.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PULSE.xcarchive/Products/Applications/PULSE.app"
          if [ ! -d "$APP" ]; then
            echo "::error::PULSE.app not found in archive"
            ls -R "$RUNNER_TEMP/PULSE.xcarchive/Products" || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          rm -rf "$RUNNER_TEMP/Payload/PULSE.app/_CodeSignature" || true
          cd "$RUNNER_TEMP"
          zip -qry PULSE-unsigned.ipa Payload
          unzip -l PULSE-unsigned.ipa | head -n 15
          ls -lh PULSE-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-unsigned-ipa
          path: ${{ runner.temp }}/PULSE-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Summarize compiler errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          if [ -f "$LOG" ]; then
            echo "===================== ОШИБКИ КОМПИЛЯЦИИ ====================="
            grep -nE "error:" "$LOG" | sed -E 's|/Users/runner/work/[^/]*/[^/]*/||g' | head -n 50 || echo "(строк с 'error:' не найдено)"
            echo "=============================================================="
            echo "Полный лог — в артефакте build-log."
          else
            echo "build.log отсутствует — сборка упала до xcodebuild (проверь шаги XcodeGen / xcode-select)."
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Publish to "latest" release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          NOTES="Автосборка PULSE · $(date -u +'%Y-%m-%d %H:%M UTC') · ${GITHUB_SHA:0:7}"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest --title "PULSE — latest build" --notes "$NOTES"
          fi
          gh release upload latest PULSE-unsigned.ipa --clobber
